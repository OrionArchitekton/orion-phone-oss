name: repo-guardrails

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:  # the release workflow runs these same checks on the tagged commit

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Compile hygiene
        run: python -m compileall -q src tests
      - name: No trailing whitespace
        run: "! git grep -n -I -E '[[:blank:]]+$'"

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --require-hashes --force-reinstall -r bootstrap-requirements.txt
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build with the release's tools, pinned by hash
        # In a fresh virtual environment, every tool installed again from its hashed file (pip skips the hash
        # check for a package already installed at the pinned version), and without isolation, so that the
        # build runs only these files.
        run: |
          python -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/python" -m pip install --require-hashes --force-reinstall -r bootstrap-requirements.txt
          "$RUNNER_TEMP/build/bin/python" -m pip install --require-hashes --force-reinstall \
            -r .github/build-requirements.txt
          "$RUNNER_TEMP/build/bin/python" -m build --no-isolation
      - name: Release archives carry config, bootstrap, and the complete test harness
        run: |
          python - <<'PYARCHIVE'
          import glob, tarfile, zipfile
          with zipfile.ZipFile(glob.glob('dist/*.whl')[0]) as wheel:
              assert 'orion_phone/config.example.toml' in wheel.namelist()
          with tarfile.open(glob.glob('dist/*.tar.gz')[0]) as source:
              names = {name.split('/', 1)[1] for name in source.getnames() if '/' in name}
              required = {'bootstrap-requirements.txt', '.github/verify_release.py',
                          'tests/conftest.py', 'tests/fake_adb.py', 'tests/fake_systemctl.py'}
              assert required <= names, sorted(required - names)
          PYARCHIVE

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --verbose .

  required-checks-fail-closed:
    if: ${{ always() }}
    needs: [lint, unit, build, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Require every prerequisite to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os; results=json.loads(os.environ["RESULTS"]); assert results and all(v["result"]=="success" for v in results.values()), results'
