[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-phone"
version = "0.2.0"
description = "Android emulator phones for AI agents: leases, a locked tier, and an audit trail."
readme = "README.md"
license = "MIT"
authors = [{ name = "Dan Mercede" }]
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3"]
keywords = ["android", "emulator", "mcp", "model-context-protocol", "ai-agents", "claude", "codex", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Emulators",
]

[project.urls]
Homepage = "https://github.com/OrionArchitekton/orion-phone-oss"
Issues = "https://github.com/OrionArchitekton/orion-phone-oss/issues"
Changelog = "https://github.com/OrionArchitekton/orion-phone-oss/blob/main/CHANGELOG.md"
Security = "https://github.com/OrionArchitekton/orion-phone-oss/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orion-phone = "orion_phone.cli:entry"
orion-phone-mcp = "orion_phone.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orion_phone = ["config.example.toml"]  # what `orion-phone init` writes

[tool.pytest.ini_options]
testpaths = ["tests"]
